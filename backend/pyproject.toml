[project]
name = "precip"
version = "0.1.0"
description = "ECMWF Open Data (IFS) precipitation forecast explorer: data pipeline and API"
requires-python = ">=3.10"
dependencies = [
  "requests>=2.31",
  "numpy>=1.26",
  "eccodes>=2.38",
  "fastapi>=0.110",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.setuptools]
packages = ["precip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
